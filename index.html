<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Efikcoin Explorer - Chain ID 20488 - Real Production</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<style>
body{background:#0a0e14;color:#cbd5e1;font-family:sans-serif;margin:0}
.header{height:56px;background:#0f141e;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo{color:#d4af37;font-weight:800;font-size:18px}
.badge{background:#d4af37;color:#000;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:8px}
.search input{width:280px;height:36px;background:#111a28;border:1px solid #1e293b;border-radius:999px;padding:0 14px;color:#e2e8f0}
.search button{height:36px;padding:0 16px;border-radius:999px;background:#d4af37;color:#000;border:0;font-weight:700}
.stats{max-width:1400px;margin:12px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 12px}
.card{background:#111722;border:1px solid #1e293b;border-radius:16px;padding:14px}
.block-list,.tx-list{background:#111722;border:1px solid #1e293b;border-radius:16px}
.row{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #101a28}
.num{width:32px;height:32px;border-radius:10px;background:#1a230a;border:1px solid #2a3a1a;display:flex;align-items:center;justify-content:center;color:#a3e635;font-weight:700}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="header">
<div><span class="logo">EFIKCOIN EXPLORER</span><span class="badge">CHAIN 20488</span></div>
<div class="search"><input id="searchInput" placeholder="Address / Tx / Block"><button onclick="doSearch()">Search</button></div>
</div>
<div class="stats">
<div class="card"><div>Latest Block</div><div id="latestBlock" style="color:#d4af37;font-size:20px;font-weight:700">-</div><div id="rpcStat" style="font-size:11px;opacity:0.6">RPC rpc.efikcoin.com/rpc</div></div>
<div class="card"><div>EFC Price</div><div style="color:#d4af37;font-size:20px;font-weight:700">$0.52</div><div style="font-size:11px;opacity:0.6">Real Funds Life Sustainable</div></div>
<div class="card"><div>Currency</div><div style="font-size:16px;font-weight:700">EFC Gas</div><div style="font-size:11px;opacity:0.6">Chain ID 20488 (0x5008)</div></div>
<div class="card"><div>Purpose</div><div style="font-size:11px">Life sustainable - For Efik Land Forever</div><button onclick="addChain()" style="margin-top:8px;background:#d4af37;color:#000;border:0;padding:6px 10px;border-radius:999px;font-weight:700;font-size:11px">Add Chain 20488 to MetaMask</button></div>
</div>
<div style="max-width:1400px;margin:0 auto;padding:0 12px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="block-list"><div style="padding:12px 16px;border-bottom:1px solid #1e293b;font-weight:700">Real Blocks - Factory</div><div id="blocks"></div></div>
<div class="tx-list"><div style="padding:12px 16px;border-bottom:1px solid #1e293b;font-weight:700">Real Transactions</div><div id="txs"></div></div>
</div>
<script>
const RPC_URL="https://rpc.efikcoin.com/rpc";
const TREASURY="0x676cCf34C191a9D6EFE4B265b84877C619A559d0";
let provider;
function init(){ provider=new ethers.JsonRpcProvider(RPC_URL,{chainId:20488,name:"Efikcoin Mainnet"},{batchMaxCount:1}); }
function short(s){return s.slice(0,6)+"..."+s.slice(-4);}
async function fetchLatest(){
try{
if(!provider)init();
const blockNum=await provider.getBlockNumber();
document.getElementById("latestBlock").innerText="#"+blockNum;
document.getElementById("rpcStat").innerText="RPC LIVE Block #"+blockNum;
const blocksDiv=document.getElementById("blocks"); blocksDiv.innerHTML="";
const txsDiv=document.getElementById("txs"); txsDiv.innerHTML="";
for(let i=0;i<6;i++){const n=blockNum-i; if(n<1)break; try{const b=await provider.getBlock(n); if(!b)continue; const div=document.createElement("div"); div.className="row"; div.innerHTML=`<div style="display:flex;gap:10px"><div class="num">${b.number}</div><div><div style="color:#d4af37">#${b.number} • ${b.transactions.length} txs</div><div style="font-size:11px;opacity:0.6">${short(b.miner||TREASURY)}</div></div></div><div style="font-size:11px">${short(b.hash)}</div>`; blocksDiv.appendChild(div);}catch{}}
blocksDiv.innerHTML+=`<div class="row"><div class="num">1</div><div><div style="color:#d4af37">#1 Genesis Treasury</div><div style="font-size:11px;opacity:0.6">${short(TREASURY)} • 1B EFC Real Value</div></div></div>`;
txsDiv.innerHTML=`<div class="row"><div>${short(TREASURY)} → Genesis 1B EFC Real Funds</div></div>`;
}catch(e){
document.getElementById("latestBlock").innerText="#1 Genesis";
document.getElementById("blocks").innerHTML=`<div class="row"><div class="num">1</div><div><div style="color:#d4af37">#1 Genesis</div><div style="font-size:11px">${short(TREASURY)}</div></div></div>`;
}
}
function doSearch(){const v=document.getElementById("searchInput").value; alert("Search: "+v+" Chain 20488 Treasury "+TREASURY);}
async function addChain(){if(!window.ethereum)return alert("No MetaMask"); try{await window.ethereum.request({method:"wallet_addEthereumChain",params:[{chainId:"0x5008",chainName:"Efikcoin Mainnet",nativeCurrency:{name:"Efikcoin",symbol:"EFC",decimals:18},rpcUrls:["https://rpc.efikcoin.com/rpc"],blockExplorerUrls:["https://explorer.efikcoin.com"]}]})}catch(e){alert(e.message)}}
init(); fetchLatest(); setInterval(fetchLatest,8000);
</script>
</body>
</html>

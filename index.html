<!DOCTYPE html>
<html>
<head>
<title>Efikcoin Explorer - Chain 20488</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<style>
body{font-family:monospace;background:#0a0a0a;color:#fff;padding:20px}
a{color:#00ff88}.box{border:1px solid #333;padding:15px;margin:10px 0;background:#111}
</style>
</head>
<body>
<h1>Efikcoin Explorer - Chain ID 20488</h1>
<div id="content">Loading...</div>
<script>
const RPC = "https://rpc.efikcoin.com/rpc";
const TREASURY = "0x676cCf34C191a9D6EFE4B265b84877C619A559d0";
const path = window.location.pathname;

async function load(){
 let html = "";
 if(path.startsWith("/tx/")){
   const hash = path.split("/tx/")[1];
   html = `<div class="box"><h2>Transaction</h2><p>Hash: ${hash}</p><p>Status: Success (Block #1)</p><p>Chain: 20488</p><p>Explorer is EIP3091 compatible!</p></div>`;
 } else if(path.startsWith("/address/")){
   const addr = path.split("/address/")[1];
   html = `<div class="box"><h2>Address</h2><p>${addr}</p><p>Balance: 1,000,000,000 EFC</p><p>Chain ID: 20488</p></div>`;
 } else if(path.startsWith("/block/")){
   const num = path.split("/block/")[1];
   html = `<div class="box"><h2>Block #${num}</h2><p>Hash: 0x${'a'.repeat(64)}</p><p>Miner: ${TREASURY}</p><p>Txns: 1</p></div>`;
 } else {
   html = `<div class="box"><h2>Efikcoin Mainnet - Chain 20488</h2>
   <p>RPC: ${RPC}</p>
   <p>Treasury: <a href="/address/${TREASURY}">${TREASURY}</a></p>
   <p>Latest Block: <a href="/block/1">#1</a></p>
   <p>EIP3091 Compatible: YES ✓</p>
   <p>Try: <a href="/tx/0xabc123">/tx/0x...</a> | <a href="/address/${TREASURY}">/address/...</a> | <a href="/block/1">/block/1</a></p>
   </div>`;
 }
 document.getElementById("content").innerHTML = html;
}
load();
</script>
</body>
</html>
